name: Build Carnage

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Setup Gradle Workspace
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon setupCiWorkspace

      - name: Compile Carnage
        run: |
          ./gradlew --no-daemon clean assemble

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carnage-Client
          path: build/libs/*.jar
          if-no-files-found: error
